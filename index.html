<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sindbad Inside</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: website, not dashboard — transparent header over full-bleed showroom photography, editorial sections below, every page opens on a photo banner. */
:root{
  --deep:#08343B;      /* Sindbad deep teal: header band, footer, dark bands */
  --sea:#0A8BA0;       /* brand teal: actions, links */
  --aqua:#70CDDD;      /* brand light aqua */
  --bronze:#B07A4A;    /* LED-trim bronze from the OPPEIN kitchens: secondary accent */
  --lime:#CFDD28;      /* brand lime: tiny highlights only */
  --char:#383837;      /* brand charcoal */
  --bg:#F2F5F5; --surface:#FFFFFF; --surface2:#F7F9F9; --ink:#122A2E; --ink2:#34494D; --muted:#62777B;
  --line:rgba(18,42,46,.10); --line2:rgba(18,42,46,.18);
  --soft:rgba(10,139,160,.09); --soft-ink:#077585;
  --b300:#70CDDD;--b500:#0A8BA0;--b700:#077585;--b900:#053C45;--ring:rgba(10,139,160,.3);
  --sh:0 24px 48px -28px rgba(8,52,59,.45);
  --display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Alexandria",system-ui,"Segoe UI",Tahoma,sans-serif;
  --hh:78px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081619;--surface:#0E2226;--surface2:#12292E;--ink:#E7F1F2;--ink2:#C2D6D9;--muted:#8FA8AC;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--soft:rgba(112,205,221,.10);--soft-ink:#86D7E4;
  --bronze:#D09A68;--sh:0 24px 48px -24px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081619;--surface:#0E2226;--surface2:#12292E;--ink:#E7F1F2;--ink2:#C2D6D9;--muted:#8FA8AC;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--soft:rgba(112,205,221,.10);--soft-ink:#86D7E4;
  --bronze:#D09A68;--sh:0 24px 48px -24px rgba(0,0,0,.7);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--deep)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
a{color:var(--soft-ink);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:10px}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.tnum{font-variant-numeric:tabular-nums}

/* ===== header ===== */
.hdr{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:50;height:var(--hh);color:#fff;transition:background .35s,color .35s,box-shadow .35s,height .35s}
.hdr.solid{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);color:var(--ink);box-shadow:0 1px 0 var(--line);--hh:68px}
.hin{height:100%;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px;color:inherit;flex-shrink:0}
.brand .bm{width:30px;height:32px;display:block}
.brand .bm svg{width:100%;height:100%}
.brand .bw b{display:block;font-family:var(--display);font-weight:500;font-size:19px;line-height:1.1}
.brand .bw small{display:block;font-size:11px;opacity:.7;letter-spacing:.08em;unicode-bidi:isolate}
.mainnav{display:flex;gap:2px;flex:1;justify-content:center;min-width:0}
.mainnav a{color:inherit;opacity:.82;font-size:14.5px;font-weight:500;padding:8px 13px;border-radius:999px;white-space:nowrap;position:relative;transition:opacity .2s,background .2s}
.mainnav a:hover{opacity:1;background:rgba(255,255,255,.12)}
.hdr.solid .mainnav a:hover{background:var(--soft)}
.mainnav a.on{opacity:1}
.mainnav a.on::after{content:"";position:absolute;inset-inline:13px;bottom:2px;height:2px;border-radius:2px;background:var(--lime)}
.hdr.solid .mainnav a.on::after{background:var(--sea)}
.hact{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-inline-start:auto}
.hb{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:inherit;cursor:pointer;position:relative;font-weight:600;font-size:13px;transition:background .2s,border-color .2s}
.hb:hover{background:rgba(255,255,255,.18)}
.hdr.solid .hb{border-color:var(--line2);background:transparent}
.hdr.solid .hb:hover{background:var(--soft)}
.hb svg{width:18px;height:18px}
.hb .dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--deep)}
.hdr.solid .hb .dot{box-shadow:0 0 0 2px var(--surface);background:#E5484D}
.me{display:flex;align-items:center;gap:8px;padding-inline-start:6px}
.me img,.me .av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--aqua);color:var(--deep);display:grid;place-items:center;font-weight:600;border:2px solid rgba(255,255,255,.6)}
.hb.menu{display:none}
@media (max-width:1180px){.mainnav{display:none}.hb.menu{display:grid}.hdr .hb.hide-sm{display:none}}
@media (max-width:420px){.me{display:none}.brand .bw small{display:none}}

/* ===== mobile menu ===== */
.mmenu{position:fixed;inset:0;z-index:70;background:var(--deep);color:#fff;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  opacity:0;pointer-events:none;transform:translateY(-12px);transition:opacity .3s,transform .3s}
.mmenu.open{opacity:1;pointer-events:auto;transform:none}
.mmenu .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.mmenu nav{display:grid;gap:2px;overflow-y:auto}
.mmenu nav a{color:#fff;font-family:var(--display);font-weight:300;font-size:26px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.mmenu nav a.on{color:var(--lime)}
.mmenu nav a svg{width:20px;height:20px;opacity:.5}
[dir="rtl"] .mmenu nav a svg{transform:scaleX(-1)}

/* ===== banners ===== */
.banner{position:relative;color:#fff;overflow:hidden;background:var(--deep);isolation:isolate}
.banner .bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.04);animation:settle 1.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes settle{to{transform:none}}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,34,39,.92) 0%,rgba(5,34,39,.72) 45%,rgba(5,34,39,.25) 100%)}
[dir="rtl"] .banner::before{background:linear-gradient(270deg,rgba(5,34,39,.92) 0%,rgba(5,34,39,.72) 45%,rgba(5,34,39,.25) 100%)}
.banner .bin{padding-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 54px);padding-bottom:52px}
.crumbs{font-size:13px;opacity:.75;display:flex;gap:8px;align-items:center;margin-bottom:14px}
.crumbs a{color:#fff}
.banner .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.banner .ph h1{margin:0;font-weight:300;font-size:clamp(32px,4.6vw,56px);line-height:1.15;color:#fff}
.banner .ph p{margin:12px 0 0;max-width:60ch;color:rgba(255,255,255,.82);font-size:16.5px}
.banner .ph>div:last-child:not(:first-child),.banner .ph>.btn{flex-shrink:0}
.banner .btn.o{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(8px)}
.banner .btn.o:hover{background:rgba(255,255,255,.2)}
.content{padding-top:44px;padding-bottom:88px}
.view.enter .content>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.enter .content>*:nth-child(2){animation-delay:.06s}.view.enter .content>*:nth-child(3){animation-delay:.12s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== HOME hero: cinematic collection slideshow, slides change through the logo's horizontal stripes ===== */
.hero{position:relative;color:#fff;background:#04161A;isolation:isolate;overflow:hidden;min-height:clamp(680px,96vh,960px);display:flex;flex-direction:column;justify-content:flex-end}
.stage{position:absolute;inset:-8% 0 0;z-index:-4;will-change:transform}
.slide{position:absolute;inset:0;visibility:hidden}
.slide.on{visibility:visible}
.slide img,.wipe img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);transform-origin:50% 50%;max-width:none}
.slide.on img{animation:kb 14s linear forwards}
@keyframes kb{to{transform:scale(1.005)}}
.wipe{position:absolute;inset:0;z-index:2}
.wipe i{position:absolute;inset-inline:0;height:calc(12.5% + 1px);overflow:hidden;clip-path:inset(0 100% 0 0);animation:barL .9s cubic-bezier(.76,0,.24,1) forwards}
.wipe i:nth-child(even){clip-path:inset(0 0 0 100%);animation-name:barR}
.wipe img{position:absolute;left:0;height:calc(800% - 8px)}
@keyframes barL{to{clip-path:inset(0 0 0 0)}}@keyframes barR{to{clip-path:inset(0 0 0 0)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:
  linear-gradient(90deg,rgba(3,24,28,.92) 0%,rgba(3,24,28,.66) 36%,rgba(3,24,28,.14) 68%,rgba(3,24,28,.3) 100%),
  linear-gradient(0deg,rgba(3,24,28,.95) 0%,rgba(3,24,28,.4) 32%,transparent 58%),
  linear-gradient(180deg,rgba(3,24,28,.6) 0%,transparent 24%)}
[dir="rtl"] .hero::before{background:
  linear-gradient(270deg,rgba(3,24,28,.92) 0%,rgba(3,24,28,.66) 36%,rgba(3,24,28,.14) 68%,rgba(3,24,28,.3) 100%),
  linear-gradient(0deg,rgba(3,24,28,.95) 0%,rgba(3,24,28,.4) 32%,transparent 58%),
  linear-gradient(180deg,rgba(3,24,28,.6) 0%,transparent 24%)}
.slats{position:absolute;inset:0;z-index:-1;pointer-events:none}
.slats i{position:absolute;inset-inline:0;height:calc(12.5% + 1px);background:#04161A;transform-origin:left center;animation:slat 1s cubic-bezier(.76,0,.24,1) forwards}
.slats i:nth-child(even){transform-origin:right center}
@keyframes slat{to{transform:scaleX(0)}}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:end;padding-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 48px);padding-bottom:44px}
.hcopy{will-change:transform,opacity}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:rgba(255,255,255,.78)}
.hero .meta span{display:inline-flex;align-items:center;gap:8px}
.hero .meta .lv{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(207,221,40,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(207,221,40,0)}100%{box-shadow:0 0 0 0 rgba(207,221,40,0)}}
.hero h1{margin:22px 0 16px;font-weight:200;font-size:clamp(50px,7.6vw,112px);line-height:1.02;letter-spacing:-.025em;color:#fff}
.hero h1 span{display:block}
.hero h1 .l2{font-weight:500}
.hero.intro h1 span,.hero.intro .ask,.hero.intro .hsearch,.hero.intro .pop,.hero.intro .meta,.hero.intro .pray{animation:hin 1s cubic-bezier(.2,.8,.2,1) both}
.hero.intro .meta{animation-delay:.55s}.hero.intro h1 .l1{animation-delay:.65s}.hero.intro h1 .l2{animation-delay:.75s}.hero.intro .ask{animation-delay:.85s}.hero.intro .hsearch{animation-delay:.95s}.hero.intro .pop{animation-delay:1.05s}.hero.intro .pray{animation-delay:1.1s}
@keyframes hin{from{opacity:.001;transform:translateY(26px)}}
.hero .ask{font-size:clamp(17px,1.6vw,21px);color:rgba(255,255,255,.86);margin:0 0 28px;max-width:46ch}
.hsearch{display:flex;align-items:center;gap:14px;max-width:620px;width:100%;height:64px;padding:0 10px 0 24px;border-radius:999px;background:rgba(255,255,255,.96);color:#4F6367;cursor:pointer;border:0;box-shadow:0 26px 50px -20px rgba(0,0,0,.6);text-align:start;font-size:15.5px;transition:transform .25s,box-shadow .25s}
.hsearch:hover{transform:translateY(-2px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
[dir="rtl"] .hsearch{padding:0 24px 0 10px}
.hsearch svg{width:20px;height:20px;color:var(--sea);flex-shrink:0}
.hsearch .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsearch .k{font-size:11px;border:1px solid #D5E2E4;border-radius:6px;padding:1px 7px;color:#7A8C90;direction:ltr}
.hsearch .go{height:46px;padding:0 22px;border-radius:999px;background:var(--sea);color:#fff;display:inline-flex;align-items:center;font-weight:600;font-size:14px;flex-shrink:0}
.pop{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.pop small{color:rgba(255,255,255,.62);font-size:13px;margin-inline-end:4px}
.pop button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;padding:7px 15px;font-size:13.5px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
.pop button:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}
.pray{background:rgba(4,28,33,.42);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-radius:28px;padding:22px}
.pray .ph2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.pray h3{margin:0;font-size:14px;font-weight:500;color:rgba(255,255,255,.8)}
.pray select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.pray select option{color:#122A2E}
.pray .next{display:flex;align-items:baseline;gap:10px;margin:6px 0 16px;flex-wrap:wrap}
.pray .next b{font-family:var(--display);font-weight:300;font-size:42px;line-height:1.1;color:#fff}
.pray .next span{font-size:13.5px;color:var(--lime)}
.pray ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pray li{padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.66)}
.pray li b{display:block;font-size:15px;font-weight:500;color:#fff}
.pray li.on{background:var(--lime);color:#2B3200}
.pray li.on b{color:#1A1F00}
.pray .note{font-size:11.5px;color:rgba(255,255,255,.48);margin-top:10px}
.hbar{padding-bottom:116px}
.hbin{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:32px;align-items:center;padding-top:22px;border-top:1px solid rgba(255,255,255,.16)}
.cap{display:flex;align-items:center;gap:18px;min-width:0}
.cap .cno{font-family:var(--display);font-weight:200;font-size:46px;line-height:1;color:var(--lime);letter-spacing:-.02em}
.cap b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.3}
.cap small{display:block;color:rgba(255,255,255,.68);font-size:13.5px}
.cap>*{animation:capin .8s cubic-bezier(.2,.8,.2,1) both}.cap>*:nth-child(2){animation-delay:.08s}.cap>*:nth-child(3){animation-delay:.16s}
@keyframes capin{from{opacity:.001;transform:translateY(14px)}}
.capl{background:transparent;cursor:pointer;font-family:inherit;display:inline-flex;gap:8px;align-items:center;color:#fff;font-size:13.5px;font-weight:600;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 15px;margin-inline-start:8px;white-space:nowrap;transition:background .2s,color .2s}
.capl:hover{background:var(--lime);color:#1A1F00;border-color:var(--lime)}
.capl svg{width:15px;height:15px}
.hprog{display:flex;gap:8px;width:min(300px,28vw)}
.hseg{flex:1;height:24px;position:relative;cursor:pointer;background:none;border:0;padding:0}
.hseg::after{content:"";position:absolute;inset-inline:0;top:11px;height:2px;border-radius:2px;background:rgba(255,255,255,.22)}
.hseg .fill{position:absolute;inset-inline-start:0;top:11px;height:2px;border-radius:2px;width:0;z-index:1;background:#fff}
.hseg.done .fill{width:100%;background:rgba(255,255,255,.7)}
.hseg.on .fill{background:var(--lime);animation:fill 7s linear forwards}
@keyframes fill{to{width:100%}}
.hero.paused .hseg.on .fill{animation-play-state:paused}
.hero.still .hseg.on .fill{animation:none;width:100%}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl .cnt{font-size:13px;color:rgba(255,255,255,.6);margin-inline-end:8px;direction:ltr}
.ctrl .cnt b{color:#fff;font-weight:600}
.ctrl .hb{width:46px;height:46px}
.rflip{transform:scaleX(-1)}[dir="rtl"] .rflip{transform:none}
@media (max-width:1100px){.hgrid{grid-template-columns:minmax(0,1fr) 300px;gap:32px}}
@media (max-width:980px){
  .hero{min-height:0}
  .hero::before,[dir="rtl"] .hero::before{background:linear-gradient(180deg,rgba(3,24,28,.78) 0%,rgba(3,24,28,.62) 45%,rgba(3,24,28,.95) 100%)}
  .hgrid{grid-template-columns:1fr;gap:28px;padding-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 32px)}
  .hbin{grid-template-columns:minmax(0,1fr) auto;gap:16px 20px}
  .cap{grid-column:1/-1}
  .hprog{width:auto;flex:1}
}
@media (max-width:560px){.today .trules{display:none}.hsearch .go,.hsearch .k{display:none}.hsearch{height:56px}.capl{display:none}.cap .cno{font-size:36px}.hbar{padding-bottom:104px}}


/* today card */
.today h3{margin:0;font-size:14px;font-weight:500;color:rgba(255,255,255,.75)}
.tstate{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:300;font-size:30px;line-height:1.25;color:#fff;margin-top:10px}
.tstate i{width:10px;height:10px;border-radius:50%;background:#8FA3A6;flex-shrink:0}
.tstate.on i{background:#5FD068;box-shadow:0 0 0 5px rgba(95,208,104,.2)}
.tstate.soon i{background:var(--lime)}
.tsub{margin:4px 0 16px;color:rgba(255,255,255,.72);font-size:14px}
.today .trules{grid-template-columns:1fr;list-style:none;margin:0 0 18px;padding:16px 0 0;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:11px}
.today .trules li{background:none;border-radius:0;padding:0;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:rgba(255,255,255,.86);line-height:1.5}
.trules svg{width:18px;height:18px;flex-shrink:0;color:var(--aqua);margin-top:1px}
.tpend{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 14px;border-radius:14px;background:rgba(207,221,40,.14);color:var(--lime);font-size:13.5px;font-weight:600;margin-bottom:10px}
.tbtn{width:100%;background:#fff;color:#08343B}
.tbtn:hover{background:var(--lime);color:#1A1F00}
.cap .clbl{display:block;font-size:12px;font-weight:600;color:var(--lime);margin-bottom:2px}
/* role paths */
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:1100px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.roles{grid-template-columns:1fr}.role .rh{height:112px}}
.role{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.role .rh{position:relative;height:150px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.role .rh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.role:hover .rh img{transform:scale(1.05)}
.role .rh::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,28,33,.92),rgba(4,28,33,.18))}
.role .rh b{font-family:var(--display);font-weight:400;font-size:21px;color:#fff;line-height:1.3}
.role .rh small{color:rgba(255,255,255,.8);font-size:13px}
.role ol{list-style:none;margin:0;padding:8px;display:grid;gap:2px}
.role li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) 16px;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;cursor:pointer;font-size:14px;line-height:1.5;color:var(--ink)}
.role li button:hover{background:var(--soft)}
.role li button:focus-visible{outline:3px solid var(--ring)}
.role li .n{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.role li svg{width:16px;height:16px;color:var(--muted)}
.eoline{min-height:0;flex-direction:row;align-items:center;gap:20px;margin-top:24px;padding:22px 26px}
.eoline .who{margin:0}
/* bidi: isolated LTR runs follow the page's alignment */
[dir="rtl"] .ltr{text-align:right}[dir="ltr"] .ltr{text-align:left}

/* quick services */
.qs{position:relative;z-index:2;margin-top:-72px;background:var(--surface);border-radius:26px;box-shadow:var(--sh);display:grid;grid-template-columns:repeat(6,1fr);padding:10px;border:1px solid var(--line)}
.qs>*{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;transition:background .2s;color:var(--ink)}
.qs>*:hover{background:var(--surface2)}
.qs>*:focus-visible{outline:3px solid var(--ring)}
.qs .ci{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff}
.qs .ci svg{width:22px;height:22px}
.qs b{display:block;font-weight:600;font-size:14.5px;line-height:1.35}
.qs span.s{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
@media (max-width:1180px){.qs{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.qs{grid-template-columns:repeat(2,1fr);padding:6px;border-radius:22px}.qs>*{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}}

/* sections */
.sec{padding-block:64px 8px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{margin:0;font-weight:300;font-size:clamp(26px,3vw,38px);line-height:1.2}
.sh p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.more{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--soft-ink);background:none;border:0;cursor:pointer;padding:0}
.more svg{width:16px;height:16px}
[dir="rtl"] .more svg,[dir="rtl"] .flip{transform:scaleX(-1)}

/* news mosaic */
.mosaic{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.feat{position:relative;border-radius:26px;overflow:hidden;min-height:440px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;isolation:isolate}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.feat:hover img{transform:scale(1.04)}
.feat::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,28,33,.92) 0%,rgba(4,28,33,.35) 55%,transparent 80%)}
.feat h3{margin:12px 0 8px;font-weight:400;font-size:clamp(22px,2.4vw,30px);line-height:1.3;color:#fff}
.feat p{margin:0;color:rgba(255,255,255,.8);max-width:58ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600}
.feat .tag{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px)}
.nlist{display:grid;gap:4px;align-content:start}
.nrow{display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px;align-items:center;padding:12px;border-radius:20px;cursor:pointer;transition:background .2s}
.nrow:hover{background:var(--surface)}
.nrow img{width:116px;height:96px;object-fit:cover;border-radius:16px}
.nrow h4{margin:6px 0 0;font-weight:500;font-size:16.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .nmeta{color:var(--muted)}
@media (max-width:900px){.mosaic{grid-template-columns:1fr}.feat{min-height:360px}}

/* your day row */
.day{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:980px){.day{grid-template-columns:1fr}}
.eotm{position:relative;overflow:hidden;border-radius:26px;padding:28px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,rgba(112,205,221,.25),transparent 55%),var(--deep);min-height:280px;display:flex;flex-direction:column}
.eotm .lbl{font-size:13px;color:var(--lime);font-weight:500}
.eotm .who{display:flex;gap:16px;align-items:center;margin-top:auto}
.eotm .ring{width:84px;height:84px;border-radius:50%;padding:3px;background:conic-gradient(var(--lime),var(--aqua),var(--bronze),var(--lime));flex-shrink:0}
.eotm .ring>*{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0E4A54;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:300;color:#fff;border:3px solid var(--deep)}
.eotm h3{margin:0;font-weight:400;font-size:22px;color:#fff}
.eotm p{margin:2px 0 0;color:rgba(255,255,255,.7);font-size:14px}
.eotm .stripes{position:absolute;inset-inline-end:-40px;bottom:-30px;width:200px;opacity:.07}
.eotm .ed{position:absolute;top:18px;inset-inline-end:18px}
.tipc{border-radius:26px;padding:28px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-height:280px}
.tipc .q{font-family:var(--display);font-weight:300;font-size:22px;line-height:1.5;margin:14px 0 auto}
.tipc .foot2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;color:var(--muted);font-size:13px}

/* collections scroller */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.coll{scroll-snap-align:start;position:relative;aspect-ratio:3/4;max-width:100%;border-radius:24px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;isolation:isolate}
.coll img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.coll:hover img{transform:scale(1.06)}
.coll::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,28,33,.88),transparent 60%)}
.coll h3{margin:0;font-weight:400;font-size:22px;color:#fff}
.coll p{margin:4px 0 0;font-size:13.5px;color:rgba(255,255,255,.78)}
.coll .arr{position:absolute;top:18px;inset-inline-end:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);transition:background .25s}
.coll:hover .arr{background:var(--lime);color:#1A1F00}
.coll .arr svg{width:18px;height:18px}
.railnav{display:flex;gap:8px}
.railnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.railnav button svg{width:18px;height:18px}
[dir="rtl"] .railnav button svg{transform:scaleX(-1)}

/* docs with photo covers */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .3s,box-shadow .3s}
.doc:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.cover{height:170px;position:relative;overflow:hidden;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background-size:cover!important;background-position:center!important}
.cover .ty{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.cover .ti{font-family:var(--display);font-size:17px;font-weight:400;line-height:1.4}
.doc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.doc .bd p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* tools band */
.band{position:relative;color:#fff;isolation:isolate;margin-top:72px;overflow:hidden;background:var(--deep)}
.band img.bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.35}
.band::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,52,59,.75),rgba(8,52,59,.95))}
.band .wrap{padding-block:72px}
.band .sh h2,.band .sh p{color:#fff}.band .sh p{opacity:.75}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tool{all:unset;box-sizing:border-box;cursor:pointer;border-radius:24px;padding:26px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:12px;transition:background .25s,transform .25s;min-height:220px}
.tool:hover{background:rgba(255,255,255,.13);transform:translateY(-3px)}
.tool:focus-visible{outline:3px solid var(--lime)}
.tool .big{font-family:var(--display);font-weight:200;font-size:54px;line-height:1;color:var(--lime)}
.tool h3{margin:0;font-weight:400;font-size:20px;color:#fff}
.tool p{margin:0;font-size:14px;color:rgba(255,255,255,.72);flex:1}
.tool .more{color:#fff}
@media (max-width:900px){.tools{grid-template-columns:1fr}}

/* footer */
.foot{background:var(--deep);color:rgba(255,255,255,.75);font-size:14px}
.foot .wrap{padding-block:56px calc(28px + env(safe-area-inset-bottom,0px))}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.foot h4{color:#fff;font-weight:500;font-size:15px;margin:0 0 12px}
.foot a{color:rgba(255,255,255,.75)}
.foot a:hover{color:#fff}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.foot .tagline{font-family:var(--display);font-weight:200;letter-spacing:.42em;font-size:13px;color:var(--aqua);margin-top:14px;unicode-bidi:isolate}
.foot .bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);margin-top:40px;padding-top:20px;font-size:12.5px;color:rgba(255,255,255,.5)}
.foot .soc{display:flex;gap:8px;flex-wrap:wrap}
.foot .soc a{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:13px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* ===== shared primitives (inner pages) ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;min-width:0}
.card.lift{transition:transform .3s,box-shadow .3s;cursor:pointer}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ch h3{margin:0;font-size:17px;font-weight:500}
.link{font-size:13.5px;font-weight:600;color:var(--soft-ink);cursor:pointer;background:none;border:0;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,transform .1s,border-color .2s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.p{background:var(--sea);color:#fff}
.btn.p:hover{background:var(--b700)}
.btn.s{background:var(--soft);color:var(--soft-ink)}
.btn.o{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.o:hover{border-color:var(--sea)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.icon{width:38px;height:38px;padding:0}
.btn:disabled{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--soft-ink);white-space:nowrap}
.chip.g{background:color-mix(in srgb,var(--lime) 32%,transparent);color:var(--ink)}
.chip.w{background:color-mix(in srgb,var(--bronze) 18%,transparent);color:var(--bronze)}
.chip.r{background:color-mix(in srgb,#E5484D 14%,transparent);color:#C2333A}
.chip.n{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}.sm{font-size:13px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.ic svg{width:22px;height:22px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:28px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:12px 0 14px;font-size:15px;color:var(--muted);white-space:nowrap;font-weight:500;position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;border-radius:2px;background:var(--sea)}
.card .tabs{margin-bottom:18px;gap:20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--ink2)}
.inp{height:46px;border:1px solid var(--line2);background:var(--surface);border-radius:14px;padding:0 14px;width:100%;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:auto;padding:12px 14px;resize:vertical}
.inp:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 4px var(--ring)}
input[type=range]{accent-color:var(--sea);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--sea)}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:40px 20px;color:var(--muted);border:1.5px dashed var(--line2);border-radius:20px}
.empty svg{width:38px;height:38px;color:var(--aqua)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:start;padding:11px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
table.t td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
.list>*+*{border-top:1px solid var(--line)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1000px){.s4,.s3{grid-column:span 6}.s8{grid-column:span 12}}
@media (max-width:640px){.s6,.s4,.s3{grid-column:span 12}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.kpi b{display:block;font-family:var(--display);font-size:36px;font-weight:200;line-height:1.1;color:var(--soft-ink)}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.verdict{border-radius:18px;padding:18px 20px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:hidden}
.verdict::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--sea)}
[dir="rtl"] .verdict::before{border-radius:4px 0 0 4px}
.verdict.good::before{background:#4FA33A}.verdict.mid::before{background:var(--bronze)}.verdict.high::before{background:#E5484D}
.verdict b{display:block;font-family:var(--display);font-size:18px;font-weight:400;margin-bottom:3px}
.verdict span{font-size:13.5px;color:var(--muted)}
.bign{font-family:var(--display);font-size:56px;font-weight:200;line-height:1;color:var(--soft-ink)}
.ladder{display:grid;gap:8px}
.ladder div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);font-size:14px;transition:all .25s}
.ladder div.on{border-color:var(--sea);background:var(--soft)}
.ladder .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:600;font-size:13px;flex-shrink:0}
.ladder div.on .n{background:var(--sea);color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.fact{padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.fact b{display:block;font-family:var(--display);font-size:34px;font-weight:200;color:var(--soft-ink);line-height:1.2}
.fact span{font-size:13px;color:var(--muted)}
.rules-list{display:grid;gap:12px}
.rl{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--surface2)}
.rl .ic{width:40px;height:40px;border-radius:12px}
.rl b{display:block;font-weight:600}
.rl p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.two,.g2{grid-template-columns:1fr}}

/* library page */
.lib{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.cats{position:sticky;top:96px;display:grid;gap:2px}
.cats button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;font-size:14.5px;color:var(--ink2)}
.cats button:hover{background:var(--surface)}
.cats button.on{background:var(--surface);color:var(--soft-ink);font-weight:600;box-shadow:0 1px 0 var(--line)}
.cats button i{width:10px;height:10px;border-radius:50%}
.cats button em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.toolbar .inp{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.seg button svg{width:18px;height:18px}
.seg button.on{background:var(--soft);color:var(--soft-ink)}
.doclist .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 16px;cursor:pointer}
.doclist .row:hover{background:var(--surface2)}
.doclist .th{width:64px;height:48px;border-radius:10px;background-size:cover;background-position:center}
@media (max-width:860px){.lib{grid-template-columns:1fr}.cats{position:static;display:flex;overflow-x:auto;scrollbar-width:none}.cats button{white-space:nowrap}.doclist .row{grid-template-columns:56px minmax(0,1fr) auto}.doclist .row .chip{display:none}}

/* apps page */
.appg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:980px){.appg{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.appg{grid-template-columns:1fr}}
.appc{display:flex;gap:18px;align-items:flex-start;padding:24px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:transform .3s,box-shadow .3s;position:relative}
.appc:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.appc .ic{width:56px;height:56px;border-radius:18px}
.appc h3{margin:0 0 4px;font-weight:500;font-size:18px}

/* astronomical prayer times (Fajr/Isha 18°, Asr single shadow), Oman time UTC+4 */
function prayerTimes(date,lat,lng,tz=4){
  const r=Math.PI/180,sin=x=>Math.sin(x*r),cos=x=>Math.cos(x*r),tan=x=>Math.tan(x*r),asin=x=>Math.asin(x)/r,acos=x=>Math.acos(Math.max(-1,Math.min(1,x)))/r,atan2=(y,x)=>Math.atan2(y,x)/r,acot=x=>Math.atan(1/x)/r,fix=(a,b)=>((a%b)+b)%b;
  let y=date.getFullYear(),m=date.getMonth()+1;const d=date.getDate();if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4),jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-lng/360;
  const D=jd+.5-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L2=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-.00000036*D;
  const RA=fix(atan2(cos(e)*sin(L2),cos(L2))/15,24),dec=asin(sin(e)*sin(L2)),eqt=q/15-RA;
  const noon=fix(12-eqt,24)+tz-lng/15,T=a=>acos((-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/15;
  return {fajr:noon-T(18),sunrise:noon-T(.833),dhuhr:noon+1/60,asr:noon+T(-acot(1+tan(Math.abs(lat-dec)))),maghrib:noon+T(.833)+1/60,isha:noon+T(18)};
}

function hm(h){let t=Math.round(h*60);const H=Math.floor(t/60)%24,M=t%60,h12=((H+11)%12)+1;return `${h12}:${String(M).padStart(2,"0")} ${H<12?tx("ص","AM"):tx("م","PM")}`}

function lateV(m,sec){if(m<=0)return["good",tx("في الموعد","On time"),tx("لا يوجد جزاء.","No penalty.")];
 if(m<=15)return sec?["mid",tx("يُحتسب تأخيرًا","Counted as lateness"),tx("المرة الثانية في نفس الأسبوع: تُجمع الدقائق وتُخصم.","Second time this week: minutes are deducted.")]:["good",tx("ضمن فترة السماح","Within grace"),tx("مرة واحدة أسبوعيًا.","Once a week.")];
 if(m<=30)return["mid",tx("تُجمع الدقائق وتُخصم من الراتب","Minutes deducted from salary"),tx("تُحسب تراكميًا على مستوى الشهر.","Counted cumulatively each month.")];
 if(m<=60)return["mid",tx("خصم ربع يوم","Quarter-day deduction"),tx("مع تنبيه شفهي.","Plus a verbal warning.")];

let WZ={step:0,d:{}};
function emailWizard(){WZ={step:0,d:{dep:"",branch:""}};drawWZ()}
function drawWZ(){
  const s=WZ.step,d=WZ.d,dom=S.settings.emailDomain||"sindbadom.com";
  const deps=(AR()?["المبيعات والتصميم","العمليات واللوجستيات","الدعم الفني","التسويق والتقنية","الموارد البشرية","الحسابات","التدريب والتطوير"]:["Sales & Design","Operations & Logistics","Technical Support","Marketing & Technology","Human Resources","Accounts","Training & Development"]);
  const brs=BRANCHES.map(b=>AR()?b.ar:b.en).concat(tx("المقر الرئيسي","Head office"));
  const bar=`<div class="wiz">${[tx("البيانات","Details"),tx("الوظيفة","Role"),tx("المراجعة","Review")].map((x,i)=>`<div class="${i===s?"on":i<s?"done":""}"><i></i>${x}</div>`).join("")}</div>`;
  let body="";

  if(s===1)body=`<div class="field"><label for="wJob">${tx("المسمى الوظيفي","Job title")}</label><input class="inp" id="wJob" value="${esc(d.job||"")}"></div><div class="field"><label for="wDep">${tx("القسم","Department")}</label><select class="inp" id="wDep">${deps.map(x=>`<option ${d.dep===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="wBr">${tx("الفرع","Branch")}</label><select class="inp" id="wBr">${brs.map(x=>`<option ${d.branch===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="wNo">${tx("ملاحظات (اختياري)","Notes (optional)")}</label><textarea class="inp" id="wNo" rows="3">${esc(d.note||"")}</textarea></div>`;
  if(s===2)body=`<div class="addr" style="margin-bottom:16px">${esc(suggest(d.nameEn))}</div><div class="list">${[[tx("الاسم","Name"),d.nameAr],[tx("بالإنجليزية","English"),d.nameEn],[tx("الهاتف","Phone"),d.phone],[tx("الوظيفة","Job"),d.job],[tx("القسم","Department"),d.dep],[tx("الفرع","Branch"),d.branch],[tx("ملاحظات","Notes"),d.note]].filter(r=>r[1]).map(r=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:10px 0"><span class="muted">${r[0]}</span><b style="font-weight:500;text-align:end">${esc(r[1])}</b></div>`).join("")}</div><p class="muted sm" style="margin-top:14px">${tx("ينشئ قسم التقنية الحساب من لوحة إدارة البريد، وتظهر الحالة في «طلباتي».","Technology creates the mailbox in the mail console; the status appears in My requests.")}</p>${S.db&&S.uid?"":`<div class="verdict mid"><span>${tx("الإرسال يعمل عند فتح البوابة من رابطها وأنت مسجّل الدخول.","Sending works when the portal is opened from its link while signed in.")}</span></div>`}`;
  const foot=`${s?`<button class="btn o" data-wz="back">${tx("رجوع","Back")}</button>`:""}${s<2?`<button class="btn p" data-wz="next">${tx("التالي","Next")}</button>`:`<button class="btn p" data-wz="send" ${S.db&&S.uid?"":"disabled"}>${I("mail")}${tx("إرسال الطلب","Send request")}</button>`}`;
  drawer(tx("طلب بريد الشركة","Company email request"),bar+body,foot);
  if(s===0)$("#wEn").oninput=e=>{$("#wAd").textContent=suggest(e.target.value)||"name@"+dom};
}
function suggest(en){const p=String(en||"").trim().toLowerCase().replace(/[^a-z\s-]/g,"").split(/\s+/).filter(Boolean);if(!p.length)return"";return (p.length>1?p[0]+"."+p[p.length-1]:p[0])+"@"+(S.settings.emailDomain||"sindbadom.com")}
async function wzAct(a){
  const d=WZ.d;
  if(WZ.step===0&&a!=="back"){d.nameAr=$("#wAr").value.trim();d.nameEn=$("#wEn").value.trim();d.phone=$("#wPh").value.trim();if(!d.nameAr||!d.nameEn){toast(tx("أدخل الاسم بالعربية والإنجليزية.","Enter the name in Arabic and English."));return}}
  if(WZ.step===1&&a!=="back"){d.job=$("#wJob").value.trim();d.dep=$("#wDep").value;d.branch=$("#wBr").value;d.note=$("#wNo").value.trim();if(!d.job){toast(tx("أدخل المسمى الوظيفي.","Enter the job title."));return}}
  if(a==="back"){WZ.step--;return drawWZ()}
  if(a==="next"){WZ.step++;return drawWZ()}
  if(a==="send"&&S.db&&S.uid){const it={id:Date.now().toString(36),...d,addr:suggest(d.nameEn),status:"pending",at:Date.now()};const items=((S.myReq&&S.myReq.items)||[]).concat(it).slice(-20);
    try{await S.db.doc("email_requests/"+S.uid).set({items,updated:Date.now()});S.myReq={items};closeDrawer();toast(tx("تم إرسال الطلب","Request sent"));refresh("home","requests")}
    catch(e){toast(tx("تعذّر الإرسال. تأكد من صلاحيتك.","Couldn’t send. Check your access."))}}
}

 if(x=q("[data-lmode]")){S.libMode=x.dataset.lmode;try{localStorage.setItem("sb_lib",S.libMode)}catch(_){}renderView(false);return}
 if(x=q("[data-calc]")){S.calc=x.dataset.calc;$$("[data-calc]").forEach(b=>b.classList.toggle("on",b===x));renderCalc();return}
 if(x=q("[data-step]")){S.step=+x.dataset.step;renderView(false);return}
 if(q("[data-tip]")){S.tip++;const tc=q("[data-tip]").closest(".tipc");const T=TIPS[S.tip%TIPS.length];if(tc){tc.querySelector(".q").textContent=P(T[0]);tc.querySelector(".foot2 span").textContent=tx("دليل الموظف · القسم ","Handbook · section ")+T[1]}return}
 if(x=q("[data-copy]")){try{await navigator.clipboard.writeText(x.dataset.copy);toast(tx("تم النسخ ","Copied ")+x.dataset.copy)}catch(_){toast(x.dataset.copy)}return}
 if(q("[data-edit-eotm]")){editEotm();return}
 if(x=q("[data-edit-news]")){editNews(x.dataset.editNews);return}
 if(x=q("[data-edit-doc]")){editDoc(x.dataset.editDoc);return}
 if(x=q("[data-edit-app]")){editApp(x.dataset.editApp);return}
 if(q("[data-save-set]")){await save(S.db.doc("config/settings").set({emailDomain:$("#sDom").value.trim().replace(/^@/,"")||"sindbadom.com"}),tx("تم الحفظ","Saved"));return}
 if(x=q("[data-del]")){const[k,id]=x.dataset.del.split(":");if(await confirmBox(tx("تأكيد الحذف","Confirm delete"),tx("سيُحذف هذا العنصر نهائيًا من البوابة لجميع الموظفين.","This item will be removed from the portal for everyone."))){const col={news:"news",doc:"library",app:"apps"}[k];try{await S.db.doc(col+"/"+id).delete();toast(tx("تم الحذف","Deleted"))}catch(_){toast(tx("تعذّر الحذف.","Couldn’t delete."))}}return}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.matches("[data-news],[data-doc]")&&!/button|a/i.test(e.target.tagName)){e.target.click();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();return}
 if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();openPal();return}
 if(e.key==="Escape"){closeDrawer();closeSide()}
});
document.addEventListener("input",e=>{if(e.target.id==="libQ"){S.libQ=e.target.value;const all=docs(),q=S.libQ.trim().toLowerCase();$("#libRes").innerHTML=libRes(all.filter(d=>(S.libCat==="all"||d.cat===S.libCat)&&(!q||[d.title_ar,d.title_en,d.desc_ar,d.desc_en].join(" ").toLowerCase().includes(q))));}});
document.addEventListener("change",async e=>{const s=e.target.closest("[data-rq]");if(s&&S.db){const[doc,id]=s.dataset.rq.split("|");const d=S.allReq.find(x=>x.id===doc);if(!d)return;const items=(d.items||[]).map(r=>r.id===id?{...r,status:s.value}:r);try{await S.db.doc("email_requests/"+doc).set({items,updated:Date.now()});toast(tx("تم تحديث الحالة","Status updated"))}catch(_){toast(tx("تعذّر التحديث.","Update failed."))}}});
$("#palQ").oninput=()=>{PS=0;rPal()};
$("#palQ").onkeydown=e=>{if(e.key==="ArrowDown"){PS=Math.min(PS+1,PI.length-1);rPal();e.preventDefault()}else if(e.key==="ArrowUp"){PS=Math.max(PS-1,0);rPal();e.preventDefault()}else if(e.key==="Enter")runPal(PS)};
$("#pal").addEventListener("click",e=>{if(e.target.id==="pal")$("#pal").close()});
$("#searchBtn").onclick=openPal;$("#bellBtn").onclick=()=>go("news");$("#menuBtn").onclick=openSide;$("#menuClose").onclick=closeSide;$("#dClose").onclick=closeDrawer;
$("#scrim").onclick=()=>{closeDrawer();closeSide()};
$("#langBtn").onclick=()=>{S.lang=AR()?"en":"ar";try{localStorage.setItem("sb_lang",S.lang)}catch(_){}renderShell();renderView(false);if($("#drawer").classList.contains("open"))closeDrawer()};
$("#themeBtn").onclick=()=>{const h=document.documentElement;h.dataset.theme=isDark()?"light":"dark";try{localStorage.setItem("sb_theme",h.dataset.theme)}catch(_){}renderShell()};
window.addEventListener("scroll",onScroll,{passive:true});

/* ================= boot ================= */
$("#logoMark").innerHTML=mark("currentColor","#CFDD28");$("#logoMark2").innerHTML=mark("#fff","#CFDD28");
paint();
{const h=location.hash.slice(1);S.view=VIEWS[h]&&h!=="admin"?h:"home"}
if(!window.claude){S.news=[{id:"welcome",title_ar:"أهلًا بكم في البوابة الداخلية للسندباد",title_en:"Welcome to the Sindbad employee portal",body_ar:"من هنا تجدون الأدلة المعتمدة، ونماذج الطلبات، وروابط الأنظمة، وأدوات سريعة للوائح والعمولة.\nيرجى مراجعة دليل الموظف العام (إصدار سبتمبر 2026) وتوقيع إقرار الاستلام مع المدير المباشر.",body_en:"Here you’ll find approved manuals, request forms, system links and quick tools for policies and commission.",cat:"general",pinned:true,at:Date.now()}]}
renderShell();renderView(true);onScroll();
setInterval(()=>{const tb=$("#todayBody");if(tb)tb.innerHTML=todayInfo()},30000);

(async()=>{
 if(!window.claude||!window.claude.use)return;
 const[user,db,assets]=await Promise.all([claude.use("user"),claude.use("db"),claude.use("assets")]);
 if(user){try{const me=await user.me();S.uid=me.id;S.name=me.name||"";S.avatar=me.avatarUrl||"";S.isAdmin=await user.canEdit()}catch(_){}}
 S.assets=assets;
 if(db){S.db=db;S.news=[];
  db.collection("news").onSnapshot(s=>{S.news=s.docs.map(d=>({id:d.id,...d.data()}));refresh("home","news","admin")},()=>{});
  db.collection("library").onSnapshot(s=>{S.docs=s.docs.length?s.docs.map(d=>({id:d.id,...d.data()})):null;refresh("home","library","admin")},()=>{});
  db.collection("apps").onSnapshot(s=>{S.apps=s.docs.length?s.docs.map(d=>({id:d.id,...d.data()})):null;refresh("home","apps","admin")},()=>{});
  db.doc("config/settings").onSnapshot(s=>{if(s.exists)S.settings={...S.settings,...s.data()}},()=>{});
  db.doc("config/eotm").onSnapshot(s=>{S.eotm=s.exists?s.data():null;refresh("home")},()=>{});
  if(S.uid)db.doc("email_requests/"+S.uid).onSnapshot(s=>{S.myReq=s.exists?s.data():null;refresh("home","requests")},()=>{});
  if(S.isAdmin)db.collection("email_requests").onSnapshot(s=>{S.allReq=s.docs.map(d=>({id:d.id,...d.data()}));refresh("admin")},()=>{});
 }
 if(location.hash==="#admin"&&S.isAdmin)go("admin");
 renderShell();
})();
</script>

</body>
